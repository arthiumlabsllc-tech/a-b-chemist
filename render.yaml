# Render Blueprint — A&B Chemist API.
#
# This file lives at the repository root because that is the only place Render
# looks for a Blueprint. A copy under `backend/` would be read by nobody.
#
# The frontend is not described here: it deploys to Vercel, which has its own
# configuration. Describing it as a Render static site would create a second
# copy of the app at a second URL, and two URLs means two origins to allow in
# CORS_ORIGIN and two places a stale build can hide.
#
# Deploy: Render -> New -> Blueprint -> point it at this repository.

services:
  - type: web
    name: a-and-b-chemist-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    # The repository root, because the Dockerfile needs tsconfig.base.json.
    dockerContext: .
    region: oregon
    plan: free
    # Liveness, not readiness. A probe that fails while the database is down
    # restarts the instance in a loop, which makes the outage longer rather than
    # shorter. /health/ready exists for a human or an uptime check to call.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

      # Supabase, Session (pooled) connection string. The direct host is
      # IPv6-only and will not connect from Render's free tier.
      - key: DATABASE_URL
        sync: false

      # Generated by Render. They must differ from each other; a single secret
      # used for both turns a stolen access token into a seven-day refresh token.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # The deployed Vercel origin, e.g. https://a-and-b-chemist.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      # A&B Chemist's own Paystack account. Left unset, the API reports the
      # gateway as unconfigured and warns at boot; the till then records mobile
      # money manually instead of charging it. Both or neither, and both from the
      # same environment.
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: LOG_LEVEL
        value: info
